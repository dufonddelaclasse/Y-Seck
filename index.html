  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    /* Diagnostic temporaire des saccades de Chrome sur iPhone :
       ?diag=cover laisse l'iPhone gérer la zone de la barre d'accueil (sans viewport-fit=cover),
       ?diag=simple retire le menu collant, la barre du haut, la hauteur d'écran minimale et le fond fixe. */
    (function () {
      var d = (location.search.match(/[?&]diag=([a-z]+)/) || [])[1];
      if (d === 'cover') document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no');
      if (d === 'simple') {
        var s = document.createElement('style');
        s.textContent = '.tabbar,.footer{position:relative!important}.context-bar{display:none!important}.app{min-height:0!important}body::before{display:none!important}';
        document.head.appendChild(s);
      }
    })();
  </script>
