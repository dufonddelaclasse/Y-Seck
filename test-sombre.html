<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <script>
    /* Chrome sur iPhone fait varier la zone de la barre d’accueil quand ses barres se rétractent, ce qui fait saccader la page :
       il gère lui-même cette zone (sans viewport-fit=cover). Safari garde l’affichage bord à bord. */
    if (/CriOS/.test(navigator.userAgent)) { document.documentElement.classList.add('crios'); document.querySelector('meta[name="viewport"]').setAttribute('content', 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no'); }
  </script>
  <meta name="theme-color" content="#000000">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Y-Seck">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script>
    /* Raccourci sur l’écran d’accueil : l’app s’ouvre sur la page d’accueil ; la proposition d’installation
       du navigateur est gardée pour la popup affichée après un premier favori. */
    (function () {
      var standalone = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
      try {
        if (standalone && !sessionStorage.getItem('ys-launch')) {
          sessionStorage.setItem('ys-launch', '1');
          var done = (JSON.parse(localStorage.getItem('ofp-state-v1')) || {}).done;
          history.replaceState(null, '', location.pathname + location.search + (done ? '#/accueil' : ''));
        }
      } catch (e) { /* stockage indisponible */ }
      window.YSECK_INSTALL = null;
      window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.YSECK_INSTALL = e; });
      window.addEventListener('appinstalled', function () { window.YSECK_INSTALL = null; });
    })();
  </script>
  <title>Y-Seck · test Sombre</title>
  <meta name="robots" content="noindex">
  <meta name="description" content="Métiers, concours, études et prépas de la fonction publique, pour les jeunes et leurs parents.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Y-Seck · les métiers de la fonction publique">
  <meta property="og:description" content="Métiers, concours, études et prépas de la fonction publique, pour les jeunes et leurs parents.">
  <link rel="preload" href="fonts/geologica-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/style.css?v=20261019-210">
  <link rel="stylesheet" href="css/dark.css?v=20261019-210">
  <link rel="stylesheet" href="css/test-sombre.css?v=20261019-210">
  <script>(function(){try{var m=(JSON.parse(localStorage.getItem('ofp-state-v1'))||{});var c=m.colorMode||'auto';if(!m.contrast&&(c==='dark'||(c==='auto'&&matchMedia('(prefers-color-scheme: dark)').matches)))document.documentElement.classList.add('dark');}catch(e){}})();</script>
</head>
<body>
  <a class="skip" href="#contenu">Aller au contenu</a>
  <div class="app" id="app"></div>
  <span class="test-badge" aria-hidden="true">Test Sombre</span>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  <noscript><p style="padding:24px;font-family:sans-serif">Cette application a besoin de JavaScript pour fonctionner.</p></noscript>
  <script src="js/ui.js?v=20261019-210"></script>
  <script src="js/data.js?v=20261019-210"></script>
  <script src="js/catalog-data.js?v=20261019-210"></script>
  <script src="js/update.js?v=20261019-210"></script>
  <script>/* Test : mode sombre imposé, sans toucher au réglage enregistré de l’appli. */
(function(){var h=document.documentElement;function on(){if(!h.classList.contains('dark'))h.classList.add('dark');}on();
if(window.MutationObserver)new MutationObserver(on).observe(h,{attributes:true,attributeFilter:['class']});
var m=document.querySelector('meta[name="theme-color"]');if(m){var fix=function(){if(m.getAttribute('content')!=='#000000')m.setAttribute('content','#000000');};fix();if(window.MutationObserver)new MutationObserver(fix).observe(m,{attributes:true});}})();</script>
</body>
</html>
